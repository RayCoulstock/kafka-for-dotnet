services:
  jobmanager:
    image: flink:1.19-scala_2.12-java17
    ports: ["8082:8081"]
    command: jobmanager
    environment: { JOB_MANAGER_RPC_ADDRESS: jobmanager }
  taskmanager:
    image: flink:1.19-scala_2.12-java17
    depends_on: [jobmanager]
    command: taskmanager
    environment: { JOB_MANAGER_RPC_ADDRESS: jobmanager }
